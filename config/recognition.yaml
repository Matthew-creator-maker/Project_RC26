# ===================== 第一阶段：识别分相机的两个点位容器 =====================
# 初学者主要修改 cameras 下的 serial 和 stations。
# stations 是 Python 列表的 YAML 写法，例如 [LM1, LM2, LM3]。
# 判断依据是赛前打好的 LM 点，不是程序自动测量物品离地高度。
# 0~100cm 物品的观察点加入 chest；1.2m 柜子的观察点加入 head。
# 一个 LM 只能出现在一个分组中；识别路线中的每个点都必须有分组。
# 点位数量不限于 LM1~LM9；几十处点位的写法见 01_几十处点位填写教程.md。
# 当前正式配置保留原路线 LM2~LM6，待你们实际打点后再填写完整路线。
cameras:
  chest:
    # 用户已确认：胸部相机序列号是 151222073707。
    serial: "151222073707"
    # 点位多时推荐一行一个名称：方便添加、删除和查找，不用改 Python 代码。
    # 这里的列表只表示“这些点用胸部相机”，不决定走点顺序。
    stations:
      - LM2
      - LM3
      - LM4
      - LM5
      - LM6
  head:
    # 用户已确认：头部相机序列号是 151222072331。
    serial: "151222072331"
    # 打好高柜观察点后，加入本列表，并加入 task_config.json 的 competition.scan_route。
    # [] 表示当前没有给头部相机分配识别点，并不表示头部相机不可用。
    stations: []

# 与上传的测试包一致：每次只打开一个 RGB-D 相机，换角色时先关闭旧设备。
width: 640
height: 480
fps: 30
# 同一类别连续出现 3 帧才进入播报候选；不要求深度有效。
required_frames: 3
# 启动新相机后丢掉前 5 帧，让曝光/图像稳定；同相机跨点位不会重启。
warmup_frames: 5
# 以下超时控制取帧与预热；不保证 SDK pipeline.start 本身在这个时间内返回。
startup_timeout_seconds: 10
frame_timeout_ms: 500

# 比赛默认同步显示画面；机器人必须有图形桌面。
# 命令行 --show 强制显示，--no-show 强制关闭。
show_window: true
# 按 s 保存当前带框画面和 JSON；路径相对于本配置文件目录。
capture_dir: "../captures/recognition"
