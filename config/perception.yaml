# 王负责的第一阶段视觉配置
# 先使用 CPU，确认流程正确后再根据电脑环境改成 GPU。

camera:
  # test_0914.py 使用的眼在手上相机；若实物已更换，必须同步修改并重新验证标定。
  serial: "109122070489"
  width: 640
  height: 480
  fps: 30

model:
  # 路径相对于本 config.yaml 所在目录，支持 Ubuntu。
  weights: "../assets/models/RoboCup923.pt"
  confidence: 0.5
  iou: 0.45
  device: "cpu"

depth:
  # 奇数窗口：5 表示以中心像素为中心的 5×5 区域。
  region_size: 5
  # 区域内至少需要这么多个有效深度样本。
  min_valid_samples: 3

stability:
  enabled: true
  # 连续达到此帧数后，才把目标标记为 stable=true。
  required_frames: 3
  # 相邻帧目标中心允许的最大移动像素数。
  center_tolerance_px: 25
  # 两帧深度变化超过此值时，稳定计数重新开始；单位：米。
  depth_tolerance_m: 0.08

handeye:
  # 最终真实可用的“相机坐标系 → 机械臂末端坐标系”标定结果。
  # 来源：test_0914.py。不能当作固定的相机→基座矩阵使用。
  rotation_camera_to_end:
    - [0.119481, 0.992709, -0.015925]
    - [-0.992780, 0.119288, -0.012587]
    - [-0.010596, 0.017314, 0.999794]
  translation_camera_to_end_m: [-0.08077129, 0.02757049, -0.10260539]

#关节位姿调节参数，关节位姿转换速度
arm:
  ip: "192.168.192.18"
  port: 8080
  # 第 6 轴原值 -243.399° 与 116.601° 相差整整 360°，末端朝向等效。
  # 运输位第 6 轴为 170°；采用邻近的等效角，避免进出观测位时多转一整圈。
  observation_joints_deg: [5.03, 96.214, 36.861, -130.156, -104.051, 116.601]
  joint_speed: 10   #原先是5
  cartesian_speed: 10 #原先是5
  observation_settle_seconds: 1.5
  # RealMan 位姿采用 [x,y,z,rx,ry,rz]；此处旋转按 ZYX 内旋、弧度解释。
  grasp_orientation_rad: [1.514, 0.152, -0.070]
  # 完全沿用 test_0914.py 的工具坐标偏移。
  final_tool_offset_m: [0.0, 0.0, 0.04]   #原先参数[0.0, 0.0, 0.04]
  transition_tool_offset_m: [0.0, 0.0, -0.10] #原先参数[0.0, 0.0, -0.15]


  gripper_release_speed: 500  #原先参数500
  gripper_speed: 300  #原先参数200
  gripper_force: 200 #先按厂家示例使用较低力控阈值；实机单独验证夹持后再调整
  gripper_timeout_seconds: 10

grasp_test:
  timeout_seconds: 30
  stable_samples: 10
  # 硬件安全门：范围必须和当前机械臂基座坐标系的实测安全范围一致。
  # 0926 实机日志中 LM5 目标中心 y=-1.106 m，工具偏移后的最终抓取点
  # y=-1.146 m；原 [-1,1] 的 y 下限会把这个已识别目标误判为越界。
  workspace_configured: true
  workspace_m:
    x: [-1.0, 1.0]
    y: [-1.0, 1.0]
    z: [-1.0, 1.0]

  # 与 workspace 分离的关节空间安全保护。workspace 继续保持宽松，避免重现误拦截。
  motion_safety:
    enabled: true
    ik_precheck: true
    # 安全优先：SDK 无 IK 预检接口时拒绝盲目执行。
    require_ik_precheck: true
    # 6 轴机械臂 J3 接近 0° 即接近肘部完全伸直；先保留 8° 软裕量。
    j3_min_abs_deg: 8.0

# ============================================================================
# 【不同高度识别/抓取的唯一主要修改区】
# 1) stations：直接在每个高度下面填写属于该高度的 LM 导航点。
#    例如 stations: [LM3, LM4]，表示 LM3/LM4 都使用这一高度。
# 2) rail_position_inc：该高度的导轨编码位置，必须实机标定。
# 3) observation_points：该高度可放 1~N 个机械臂观察姿态；增删列表项即可。
# 4) grasp_orientation_rad / 两个 offset：该高度抓取姿态。
# 注意：同一个 LM 只能出现在一个高度的 stations 中；重复分配会直接报错。
# 未实测的高度默认 enabled: false，禁止带着占位参数上实机。
# ============================================================================
height_profiles:
  ground:
    # 【LM点分配】地面高度的导航识别点；可直接增删 LM。
    stations: [LM3, LM4]
    enabled: true
    nominal_height_m: 0.0
    rail_position_inc: -6000000
    observation_points:
      - joints_deg: [57.586, 112.896, 33.269, -110.776, -93.458, 116.63]
      # 增加地面第2识别点：取消下一行注释并填实测关节角
      # - joints_deg: [J1, J2, J3, J4, J5, J6]
    grasp_orientation_rad: [1.719, 0.088, 1.356]
    final_tool_offset_m: [0.0, 0.0, 0.04]
    transition_tool_offset_m: [0.0, 0.0, -0.10]

  table_0_5m:
    # 【LM点分配】示例：要把 LM8/LM9 分给 0.5m，就写 [LM8, LM9]。
    stations: []
    enabled: false  # TODO 实机标定后改 true
    nominal_height_m: 0.5
    rail_position_inc: -2250000  # TODO 填 0.5m 高度对应导轨 inc
    observation_points:
      - joints_deg: [5.03, 96.214, 36.861, -130.156, -104.051, 116.601]  # TODO 实测
    grasp_orientation_rad: [1.514, 0.152, -0.070]  # TODO 实测
    final_tool_offset_m: [0.0, 0.0, 0.04]
    transition_tool_offset_m: [0.0, 0.0, -0.10]

  table_0_6m:
    # 【LM点分配】属于 0.6m 的 LM 点填在这里。
    stations: []
    enabled: false  # TODO 实机标定后改 true
    nominal_height_m: 0.6
    rail_position_inc: -1500000  # TODO 实测
    observation_points:
      - joints_deg: [5.03, 96.214, 36.861, -130.156, -104.051, 116.601]  # TODO 实测
    grasp_orientation_rad: [1.514, 0.152, -0.070]
    final_tool_offset_m: [0.0, 0.0, 0.04]
    transition_tool_offset_m: [0.0, 0.0, -0.10]

  table_0_7m:
    # 【LM点分配】属于 0.7m 的 LM 点填在这里。
    stations: []
    enabled: false  # TODO 实机标定后改 true
    nominal_height_m: 0.7
    rail_position_inc: -750000  # TODO 实测
    observation_points:
      - joints_deg: [5.03, 96.214, 36.861, -130.156, -104.051, 116.601]  # TODO 实测
      # - joints_deg: [J1, J2, J3, J4, J5, J6]  # 可继续增加识别点
    grasp_orientation_rad: [1.514, 0.152, -0.070]
    final_tool_offset_m: [0.0, 0.0, 0.04]
    transition_tool_offset_m: [0.0, 0.0, -0.10]

  table_0_8m:
    # 【LM点分配】当前沿用旧配置：LM2、LM5、LM6。
    stations: [LM2, LM5, LM6]
    enabled: true
    nominal_height_m: 0.8
    rail_position_inc: 0  # 当前原代码非地面档使用的导轨行驶/上方位置
    observation_points:
      - joints_deg: [5.03, 96.214, 36.861, -130.156, -104.051, 116.601]
      # - joints_deg: [J1, J2, J3, J4, J5, J6]  # 0.8m 第2识别点预留
    grasp_orientation_rad: [1.514, 0.152, -0.070]
    final_tool_offset_m: [0.0, 0.0, 0.04]
    transition_tool_offset_m: [0.0, 0.0, -0.10]

  shelf_1_2m:
    # 【LM点分配】属于 1.2m 高层的 LM 点填在这里。
    stations: []
    enabled: false  # TODO 酒架/高层实机标定后改 true
    nominal_height_m: 1.2
    rail_position_inc: +3000000  # TODO 实测；不要直接使用占位值
    observation_points:
      - joints_deg: [5.03, 96.214, 36.861, -130.156, -104.051, 116.601]  # TODO 实测
    grasp_orientation_rad: [1.514, 0.152, -0.070]  # TODO 实测
    final_tool_offset_m: [0.0, 0.0, 0.04]
    transition_tool_offset_m: [0.0, 0.0, -0.10]


display:
  # Ubuntu 机器人可通过 SSH 无桌面运行；需要窗口时显式加 --show。
  show_window: false
